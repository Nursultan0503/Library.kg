{% extends 'base.html' %}

{% block title %}{{ title }} — Library.kg{% endblock %}

{% block content %}
    <div class="empty" style="max-width:640px">
        <h1>{{ title }}</h1>
        <form method="post" enctype="multipart/form-data" class="order-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn">Сохранить</button>
            <a href="{% if order %}{% url 'order_detail' order.id %}{% else %}{% url 'order_list' %}{% endif %}" class="btn btn-light">Отмена</a>
        </form>
    </div>
{% endblock %}
