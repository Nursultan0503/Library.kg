{% extends 'base.html' %}

{% block title %}Регистрация — Library.kg{% endblock %}

{% block content %}
    <div class="empty auth-box">
        <h1>Регистрация</h1>
        <form method="post" enctype="multipart/form-data" class="order-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>
        <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </div>
{% endblock %}
